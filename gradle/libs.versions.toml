[versions]
jackson = "3.2.3"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.1" }

nullaway = { module = "com.uber.nullaway:nullaway", version = "0.14.2" }
errorprone = { module = "com.google.errorprone:error_prone_core", version = "2.50.0" }
guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
protobuf = { module = "com.google.protobuf:protobuf-java", version = "4.36.2" }
commons-compress = { module = "org.apache.commons:commons-compress", version = "1.28.0" }
commons-io = { module = "commons-io:commons-io", version = "2.22.0" }

jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.22" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-guava = { module = "tools.jackson.datatype:jackson-datatype-guava", version.ref = "jackson" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }
