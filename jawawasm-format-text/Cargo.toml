[package]
name = "jawawasm-format-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LGPL-3.0-only"
description = "C ABI for WebAssembly text parsing used by JawaWasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
json-from-wast = "=0.261.0"
serde_json = "1.0"
wast = "=261.0.0"

[profile.release]
lto = true
# Keep parser functions small enough for the JVM's 64 KiB method limit.
opt-level = "z"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
